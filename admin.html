<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard — Saqi Corporation</title>
<script>
  (function() {
    const pw = prompt("Owner Authentication Required:");
    if (pw !== "Shahram123") {
      alert("Access Denied");
      window.location.href = "index.html";
    }
  })();
</script>
<style>
body{background:#08090b;color:#fff;font-family:sans-serif;padding:20px;max-width:600px;margin:auto}
input,button{display:block;width:100%;margin:10px 0;padding:12px;border-radius:8px;border:1px solid #333}
input{background:#15171c;color:#fff}
button{background:#c8a45a;color:#000;font-weight:bold;cursor:pointer}
.item{background:#15171c;padding:15px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.del-btn{background:#e63946;color:#fff;width:auto;padding:6px 12px;margin:0}
</style>
</head>
<body>

<h2>Add New Product</h2>
<input type="text" id="pName" placeholder="Product Name (e.g. Inverter AC)">
<input type="text" id="pPrice" placeholder="Price (e.g. Rs. 145,000)">
<input type="text" id="pIcon" placeholder="Emoji / Icon (e.g. ❄️)">
<input type="text" id="pTag" placeholder="Category Tag (e.g. CLIMATE)">
<button onclick="addProduct()">Publish to Store</button>

<hr style="border-color:#222;margin:30px 0">

<h2>Live Inventory Management</h2>
<div id="adminProductList">Loading products...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Replace values inside quotes with the keys from your Firebase screen:
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const prodRef = collection(db, "products");

  window.addProduct = async function() {
    const name = document.getElementById('pName').value;
    const price = document.getElementById('pPrice').value;
    const icon = document.getElementById('pIcon').value || "📦";
    const tag = document.getElementById('pTag').value || "GENERAL";

    if(!name || !price) return alert("Please enter both Name and Price");

    await addDoc(prodRef, { name, price, icon, tag });
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    alert("Product added successfully!");
  };

  window.deleteProduct = async function(id) {
    if(confirm("Are you sure you want to delete this product?")) {
      await deleteDoc(doc(db, "products", id));
    }
  };

  onSnapshot(prodRef, (snapshot) => {
    const list = document.getElementById('adminProductList');
    list.innerHTML = '';
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      list.innerHTML += `
        <div class="item">
          <div><b>${data.icon} ${data.name}</b> — ${data.price}</div>
          <button class="del-btn" onclick="deleteProduct('${docSnap.id}')">Delete</button>
        </div>
      `;
    });
  });
</script>
</body>
</html>
